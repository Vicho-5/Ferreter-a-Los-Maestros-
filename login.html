<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Ferretería Los Maestros</title>
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Estilos globales del proyecto -->
    <link 
        rel="stylesheet" 
        href="css/global.css"
    >

    <!-- Estilos propios del Login -->
    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>
<body>
    <!-- Contenido Principal -->
    <main class ="container min-vh-100 d-flex align-items-center justify-content-center py-5">

        <!-- Sección de Login -->
        <section    class="row justify-content-center w-100" 
                    aria-labelledby="titulo_login">

            <article    class="col-12 col-md-8 col-lg-5">

                <!-- Encabezado -->
                <header     class=""mb-4>

                    <!-- Identidad de la ferretería -->
                    <a  href="index.html"
                        class="d-inline-flex align-items-center gap-2 text-decoration-none mb-5"
                        aria-label="Ir al inicio de Ferretería Los Maestros"> 
     
                        <!-- Logo -->
                        <span   class="d-inline-flex align-items-center justify-content-center fw-bold logo-placeholder"
                                aria-hidden="true"> 
                                FM 
                        </span> 

                        <!-- Nombre de la empresa -->
                        <span   class="fw-bold text-uppercase"> 
                                Ferretería Los Maestros   
                        </span>
    
                    </a>

                    <!-- Título principal -->
                    <h1 id="titulo-login"
                        class="fw-bold mb-2">
                        Iniciar sesión 
                    </h1>
    
                    <!-- Descripción -->
                    <p  class="text-secondary mb-0">
                        Accede con tus credenciales de administrador.
                    </p>

                </header>

                <!-- Formulario Login -->
                <form id="form-login" novalidate>

                    <!-- Correo Electrónico -->   
                    <div class="mb-3">

                        <label  for="correo"
                                class="form-label fw-semibold">
                                Correo electrónico
                        </label>

                        <div class="input-group">

                            <!-- Icono correo -->
                            <span   class="input-group-text">

                                <i  class="bi bi-envelope"
                                    aria-hidden="true">
                                </i>

                            </span>

                            <!-- Campo correo -->
                            <input  type="email"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    placeholder="correo@empresa.cl"
                                    maxlength="100"
                                    autocomplete="email"
                                    aria-describedby="error-correo"
                                    required>
                        </div>

                        <!-- Mensaje de error para JavaScript -->
                        <small  id="error-correo"
                                class="text-danger"
                                aria-live="polite">
                        </small>

                    </div>

                    <!-- Contraseña -->
                    <div class="mb-3">

                        <!-- Título y recuperación -->
                        <div
                            class="d-flex justify-content-between align-items-center">

                            <label  for="contrasena"
                                    class="form-label fw-semibold">
                                    Contraseña
                            </label>

                            <a  href="#"
                                class="small text-decoration-none">
                                ¿Olvidaste tu contraseña?
                            </a>
                        
                        </div>

                        <!-- Grupo contraseña -->
                        <div class="input-group">

                            <!-- Icono candado -->
                            <span class="input-group-text">

                                <i  class="bi bi-lock"
                                    aria-hidden="true">
                                </i>
                            </span>

                            <!-- Campo contraseña -->
                            <input  type="password"
                                    class="form-control"
                                    id="contrasena"
                                    name="contrasena"
                                    placeholder="Contraseña"
                                    minlength="4"
                                    maxlength="10"
                                    autocomplete="current-password"
                                    aria-describedby="error-contrasena"
                                    required>

                            <!-- Botón -->
                            <button type="button"
                                    class="btn btn-outline-secondary"
                                    id="btn-mostrar-contrasena"
                                    aria-label="Mostrar contraseña">

                                    <i  class="bi bi-eye"
                                        aria-hidden="true">
                                    </i>

                            </button>

                        </div>
                        
                        <!-- Mensaje de error -->
                        <small  id="error-contrasena"
                                class="text-danger"
                                aria-live="polite">
                        </small> 

                    </div>

                    <!-- Mantener Sesión -->
                    <div class="form-check mb-4">
                        <input  type="checkbox"
                                class="form-check-input"
                                id="mantener-sesion"
                                name="mantener-sesion">

                        <label  for="mantener-sesion"
                                class="form-check-label">
                                Mantener sesión iniciada
                        </label>

                    </div>

                    <!-- Botón Ingresar -->
                    <button type="submit"
                            class="btn btn-primary w-100 fw-semibold py-2"
                            id="btn-ingresar">

                            Ingresar
                            <i  class="bi bi-box-arrow-in-right ms-1"
                                aria-hidden="true">
                            </i>
                    </button>

                    <!-- Separador -->
                    <div    class="d-flex align-items-center my-4"
                            aria-hidden="true">

                            <hr class="flex-grow-1">

                            <span class="mx-3 text-secondary">
                                o
                            </span>

                            <hr class="flex-grow-1">

                    </div>

                    <!-- Registro -->
                    <p  class="text-center mb-4">
                        ¿No tienes cuenta?

                        <a="registro.html"
                            class="fw-semibold">
                            Regístrate
                        </a>

                    </p>

                </form>

                <!-- Pie de Página -->
                <footer class="text-center">
                    <a  href="index.html"
                        class="text-decoration-none">

                        <i  class="bi bi-arrow-left me-1"
                            aria-hidden="true">
                        </i>

                        Volver al sitio principal
                    </a>

                </footer>
            </article>
        </section>
    </main>
<script src="js/login.js"></script>
</body>
</html>
